[package]
name = "runtime-checker"
version = "1.0.3"
edition = "2024"
description = "Detect minimum runtime versions required by JavaScript and TypeScript codebases."
license = "BSD-3-Clause"
repository = "https://github.com/usebarekey/runtime-checker"
homepage = "https://github.com/usebarekey/runtime-checker"
readme = "README.md"
keywords = ["node", "deno", "bun", "runtime", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aho-corasick = "1.1.4"
anstream = "0.6.21"
anstyle = "1.0.13"
anyhow = "1.0.102"
clap = { version = "4.5.53", features = ["derive"] }
fff-grep = "0.9.5-nightly.7d7910b"
ignore = "0.4.25"
mimalloc = "0.1"
node-semver = "2.2.0"
oxc_allocator = "0.135.0"
oxc_ast = "0.135.0"
oxc_ast_visit = "0.135.0"
oxc_parser = "0.135.0"
oxc_semantic = "0.135.0"
oxc_span = "0.135.0"
oxc_syntax = "0.135.0"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
terminal_size = "0.4.4"
thiserror = "2.0.17"
ureq = "2.12.1"

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = "3.24.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
