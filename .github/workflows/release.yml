name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_version_bump:
    runs-on: ubuntu-latest

    outputs:
      has_version_bump: ${{ steps.detect.outputs.has_version_bump }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve_release_version
        id: resolve
        shell: bash
        run: |
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          NPM_VERSION="$(node -p "require('./package.json').version")"

          if [ "$CARGO_VERSION" != "$NPM_VERSION" ]; then
            echo "Release versions are out of sync." >&2
            echo "cargo: $CARGO_VERSION" >&2
            echo "npm: $NPM_VERSION" >&2
            exit 1
          fi

          echo "release_version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: detect_version_bump
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_version_bump=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref }}" = "refs/tags/${{ steps.resolve.outputs.tag_name }}" ]; then
            echo "has_version_bump=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_version_bump=false" >> "$GITHUB_OUTPUT"

  native:
    needs: detect_version_bump
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: runtime-checker
          - os: windows-latest
            target: win32-x64
            binary: runtime-checker.exe
          - os: macos-15-intel
            target: darwin-x64
            binary: runtime-checker
          - os: macos-15
            target: darwin-arm64
            binary: runtime-checker
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_rust
        uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release

      - name: upload_binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  npm:
    needs:
      - detect_version_bump
      - native
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup_rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: resolve_release_version
        shell: bash
        run: |
          echo "TAG_NAME=${{ needs.detect_version_bump.outputs.tag_name }}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${{ needs.detect_version_bump.outputs.release_version }}" >> "$GITHUB_ENV"

      - name: ensure_tag_exists
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          git fetch --tags

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "${GITHUB_SHA}"
          git push origin "$TAG_NAME"

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: build
        run: cargo build --release

      - name: download_native_binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: .dist/native

      - name: stage_native_binaries
        shell: bash
        run: |
          mkdir -p npm/bin/native/linux-x64 npm/bin/native/win32-x64 npm/bin/native/darwin-x64 npm/bin/native/darwin-arm64
          cp .dist/native/native-linux-x64/runtime-checker npm/bin/native/linux-x64/runtime-checker
          cp .dist/native/native-win32-x64/runtime-checker.exe npm/bin/native/win32-x64/runtime-checker.exe
          cp .dist/native/native-darwin-x64/runtime-checker npm/bin/native/darwin-x64/runtime-checker
          cp .dist/native/native-darwin-arm64/runtime-checker npm/bin/native/darwin-arm64/runtime-checker
          chmod +x npm/bin/native/linux-x64/runtime-checker npm/bin/native/darwin-x64/runtime-checker npm/bin/native/darwin-arm64/runtime-checker

      - name: pack_npm
        run: npm pack

      - name: publish_to_npm
        run: npx --yes npm@11.5.1 publish --access public

      - name: create_or_update_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes "runtime-checker $RELEASE_VERSION"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "runtime-checker $RELEASE_VERSION"
          fi
